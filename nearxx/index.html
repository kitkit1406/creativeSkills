<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NEARXX — Redesign mockup · Name and contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="map-grain"></div>
    </div>

    <div class="phone" data-mockup>
      <header class="masthead">
        <div class="brand-block">
          <span class="pin" aria-hidden="true">
            <svg viewBox="0 0 48 58" fill="none">
              <path
                d="M24 3C13.5 3 5 11.4 5 21.8c0 12.6 15.4 29.4 17.5 31.6a2 2 0 0 0 3 0C27.6 51.2 43 34.4 43 21.8 43 11.4 34.5 3 24 3Z"
                stroke="currentColor"
                stroke-width="2.4"
              />
              <circle cx="24" cy="17" r="5.5" fill="currentColor" />
              <path d="M14.5 31c1.4-5.8 5-8.6 9.5-8.6s8.1 2.8 9.5 8.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            </svg>
          </span>
          <h1 class="brand">NEARXX</h1>
        </div>
        <button class="text-action" type="button">Leave</button>
      </header>

      <div class="stepper" aria-label="Onboarding progress, step 1 of 7">
        <div class="stepper-meta">Step 1 of 7</div>
        <ol class="stepper-track">
          <li class="is-current"><span class="sr-only">Step 1 current</span></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
        </ol>
      </div>

      <main class="stage">
        <p class="kicker">Profile basics</p>
        <h2 class="headline">Your name and contact</h2>
        <p class="support">
          How clients see you nearby — and how they reach you. Your number stays private until you turn it on.
        </p>

        <form class="compose" id="mock-form">
          <label class="input-row">
            <span class="label">Profile name</span>
            <input id="profile-name" type="text" placeholder="e.g. Maya R." autocomplete="nickname" />
            <span class="hint" aria-hidden="true">Shown on your card</span>
          </label>

          <button class="action soft" type="button" id="edit-details">
            <span>Edit name, age and details</span>
            <span class="chev" aria-hidden="true">→</span>
          </button>

          <button class="action accent" type="button" id="add-contact">
            <span>Add how clients contact you</span>
            <span class="chev" aria-hidden="true">→</span>
          </button>

          <button class="continue" type="submit">Continue</button>
        </form>
      </main>

      <nav class="dock" aria-label="Primary">
        <a class="dock-item is-active" href="#" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 10.5 12 4.5l7.5 6V19a1.5 1.5 0 0 1-1.5 1.5h-3.5V14h-5v6.5H6A1.5 1.5 0 0 1 4.5 19v-8.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Home
        </a>
        <a class="dock-item" href="#">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 18.5V6.2M7.5 10.2 12 5.5l4.5 4.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 18.5h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          Raise up
        </a>
        <a class="dock-item" href="#">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 7.5h12a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 18 17.5H9.2L5.5 20v-2.5H6A1.5 1.5 0 0 1 4.5 16V9A1.5 1.5 0 0 1 6 7.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Messages
        </a>
        <a class="dock-item" href="#">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4.5" y="6" width="15" height="13.5" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.5v3M16 4.5v3M4.5 10.5h15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Bookings
        </a>
        <a class="dock-item" href="#">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="7.25" stroke="currentColor" stroke-width="1.6"/><path d="M12 8.2v7.6M14.3 9.6c-.5-.7-1.3-1.1-2.3-1.1-1.5 0-2.5.8-2.5 1.9s1 1.7 2.6 2c1.7.3 2.7.9 2.7 2.1s-1.1 2-2.7 2c-1.1 0-2-.4-2.5-1.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Earnings
        </a>
      </nav>

      <div class="toast" id="toast" hidden></div>
    </div>

    <p class="mock-label">Redesign mockup · Step 1 of 7</p>
    <script src="./app.js"></script>
  </body>
</html>
