<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NEARXX — Your name and contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <a class="brand" href="#" aria-label="NEARXX home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 58" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="pinGrad" x1="8" y1="4" x2="40" y2="52" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#E8C4A4" />
                  <stop offset="1" stop-color="#C48A6A" />
                </linearGradient>
              </defs>
              <path
                d="M24 3C13.5 3 5 11.4 5 21.8c0 12.6 15.4 29.4 17.5 31.6a2 2 0 0 0 3 0C27.6 51.2 43 34.4 43 21.8 43 11.4 34.5 3 24 3Z"
                stroke="url(#pinGrad)"
                stroke-width="2.4"
              />
              <ellipse cx="24" cy="16.5" rx="5.4" ry="6" fill="url(#pinGrad)" />
              <path
                d="M14 31.5c1.2-6.2 5.2-9.2 10-9.2s8.8 3 10 9.2"
                stroke="url(#pinGrad)"
                stroke-width="2.3"
                stroke-linecap="round"
              />
              <path
                d="M18.2 28.8c1.3 1.6 3.3 2.5 5.8 2.5s4.5-.9 5.8-2.5"
                stroke="url(#pinGrad)"
                stroke-width="1.6"
                stroke-linecap="round"
                opacity="0.85"
              />
            </svg>
          </span>
          <span class="brand-word">NEAR<span>XX</span></span>
        </a>

        <div class="top-actions">
          <button class="icon-btn" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M6.5 9.5a5.5 5.5 0 0 1 11 0c0 4.2 1.6 5.8 1.6 5.8H4.9s1.6-1.6 1.6-5.8Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
              <path d="M10 18.2a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
          </button>
          <button class="lang-btn" type="button" aria-label="Language English">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.6" />
              <path d="M4.2 12h15.6M12 3.8c2.4 2.6 3.6 5.4 3.6 8.2s-1.2 5.6-3.6 8.2c-2.4-2.6-3.6-5.4-3.6-8.2S9.6 6.4 12 3.8Z" stroke="currentColor" stroke-width="1.5" />
            </svg>
            <span>EN</span>
          </button>
          <button class="logout-btn" type="button">Log out</button>
        </div>
      </header>

      <main class="onboarding">
        <a class="back-pill" href="#">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3.5 5.5 8 10 12.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Home
        </a>

        <div class="step-row">
          <p class="step-label">Step 1 of 7</p>
          <button class="leave-link" type="button">Leave</button>
        </div>

        <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="7" aria-valuenow="1" aria-label="Onboarding progress">
          <span></span>
        </div>

        <section class="content">
          <p class="eyebrow">Start here</p>
          <h1>Your name and contact</h1>
          <p class="lede">
            How clients see you and how they can reach you. A number is only shown if you turn it on.
          </p>

          <form class="fields" id="name-contact-form">
            <label class="field">
              <span class="sr-only">Profile name</span>
              <input id="profile-name" name="profileName" type="text" placeholder="Profile name" autocomplete="nickname" />
              <span class="field-affix" aria-hidden="true">M</span>
            </label>

            <button class="btn btn-ghost" type="button" id="edit-details">
              Edit name, age and details
            </button>

            <button class="btn btn-outline" type="button" id="add-contact">
              Add how clients contact you
            </button>

            <button class="btn btn-primary" type="submit">Continue</button>
          </form>
        </section>
      </main>

      <div class="toast" id="toast" hidden></div>

      <nav class="tab-bar" aria-label="Primary">
        <a class="tab is-active" href="#" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4.5 10.5 12 4.5l7.5 6V19a1.5 1.5 0 0 1-1.5 1.5h-3.5V14h-5v6.5H6A1.5 1.5 0 0 1 4.5 19v-8.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
          <span>Home</span>
        </a>
        <a class="tab" href="#">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 18.5V6.2M7.5 10.2 12 5.5l4.5 4.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M5 18.5h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          <span>Raise up</span>
        </a>
        <a class="tab" href="#">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 7.5h12a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 18 17.5H9.2L5.5 20v-2.5H6A1.5 1.5 0 0 1 4.5 16V9A1.5 1.5 0 0 1 6 7.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
          <span>Messages</span>
        </a>
        <a class="tab" href="#">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="4.5" y="6" width="15" height="13.5" rx="2" stroke="currentColor" stroke-width="1.6" />
            <path d="M8 4.5v3M16 4.5v3M4.5 10.5h15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span>Bookings</span>
        </a>
        <a class="tab" href="#">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="7.25" stroke="currentColor" stroke-width="1.6" />
            <path d="M12 8.2v7.6M14.3 9.6c-.5-.7-1.3-1.1-2.3-1.1-1.5 0-2.5.8-2.5 1.9s1 1.7 2.6 2c1.7.3 2.7.9 2.7 2.1s-1.1 2-2.7 2c-1.1 0-2-.4-2.5-1.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <span>Earnings</span>
        </a>
      </nav>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
